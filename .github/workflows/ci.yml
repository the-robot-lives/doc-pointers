name: CI

on:
  push:
    branches: [develop, main, stage]
  pull_request:
    branches: [develop, main, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # One env for every step: compiling dev then test would build deps twice.
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Restore/save split so a red test step still saves the compiled cache.
      - name: Restore deps and _build
        id: mix-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Save deps and _build
        if: steps.mix-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test (coverage gate in mix.exs)
        run: mix test --cover

      - name: Test Rust CLI and Elixir backend integration
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover/
          if-no-files-found: ignore
